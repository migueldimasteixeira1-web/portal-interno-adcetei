services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prefeitura_ti}
      POSTGRES_USER: ${POSTGRES_USER:-prefeitura_ti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prefeitura_ti} -d ${POSTGRES_DB:-prefeitura_ti}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-prefeitura_ti}
      POSTGRES_USER: ${POSTGRES_USER:-prefeitura_ti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      AUTH_MODE: ${AUTH_MODE:-local}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      LDAP_SERVER: ${LDAP_SERVER:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_HELPDESK_GROUP: ${LDAP_HELPDESK_GROUP:-GG_TI_HELPDESK}
      LDAP_TECHNICIAN_GROUP: ${LDAP_TECHNICIAN_GROUP:-GG_TI_TECNICOS}
      LDAP_ADMIN_GROUP: ${LDAP_ADMIN_GROUP:-GG_TI_ADMIN}
    expose:
      - "8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_APP_ENV: ${ENVIRONMENT:-staging}
        NEXT_PUBLIC_SHOW_DEMO_USERS: ${SHOW_DEMO_USERS:-false}
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_APP_ENV: ${ENVIRONMENT:-staging}
      NEXT_PUBLIC_SHOW_DEMO_USERS: ${SHOW_DEMO_USERS:-false}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${PORTAL_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
