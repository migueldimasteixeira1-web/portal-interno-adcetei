services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prefeitura_ti}
      POSTGRES_USER: ${POSTGRES_USER:-prefeitura_ti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prefeitura_ti} -d ${POSTGRES_DB:-prefeitura_ti}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mesh-bridge:
    build: ./apps/mesh-bridge
    environment:
      PORT: 8080
      MESH_BRIDGE_SHARED_SECRET: ${MESH_BRIDGE_SHARED_SECRET:-}
      MESH_BRIDGE_MOCK: ${MESH_BRIDGE_MOCK:-false}
      MESHCENTRAL_URL: ${MESHCENTRAL_URL:-}
      MESHCENTRAL_PUBLIC_URL: ${MESHCENTRAL_PUBLIC_URL:-}
      MESHCENTRAL_ADMIN_USER: ${MESHCENTRAL_ADMIN_USER:-}
      MESHCENTRAL_ADMIN_PASS: ${MESHCENTRAL_ADMIN_PASS:-}
      MESHCENTRAL_DOMAIN: ${MESHCENTRAL_DOMAIN:-}
      MESHCENTRAL_LOGIN_TOKEN_KEY: ${MESHCENTRAL_LOGIN_TOKEN_KEY:-}
      MESHCENTRAL_LOGIN_USER_ID: ${MESHCENTRAL_LOGIN_USER_ID:-}
      MESH_SESSION_URL_TEMPLATE: ${MESH_SESSION_URL_TEMPLATE:-}
      MESH_SESSION_TTL_SECONDS: ${MESH_SESSION_TTL_SECONDS:-3600}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-prefeitura_ti}
      POSTGRES_USER: ${POSTGRES_USER:-prefeitura_ti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      AUTH_MODE: ${AUTH_MODE:-email}
      INSTITUTIONAL_EMAIL_PATTERN: ${INSTITUTIONAL_EMAIL_PATTERN:-^[^@\s]+@[a-z0-9-]+\.cabofrio\.rj\.gov\.br$}
      EMAIL_VERIFICATION_EXPIRE_MINUTES: ${EMAIL_VERIFICATION_EXPIRE_MINUTES:-60}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      REMOTE_ACCESS_ENABLED: ${REMOTE_ACCESS_ENABLED:-false}
      MESH_BRIDGE_URL: ${MESH_BRIDGE_URL:-http://mesh-bridge:8080}
      MESH_BRIDGE_SHARED_SECRET: ${MESH_BRIDGE_SHARED_SECRET:-}
      MESH_SESSION_TTL_SECONDS: ${MESH_SESSION_TTL_SECONDS:-3600}
    expose:
      - "8000"
    depends_on:
      database:
        condition: service_healthy
      mesh-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_APP_ENV: ${ENVIRONMENT:-staging}
        NEXT_PUBLIC_SHOW_DEMO_USERS: ${SHOW_DEMO_USERS:-false}
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_APP_ENV: ${ENVIRONMENT:-staging}
      NEXT_PUBLIC_SHOW_DEMO_USERS: ${SHOW_DEMO_USERS:-false}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${PORTAL_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
