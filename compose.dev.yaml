services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prefeitura_ti
      POSTGRES_USER: prefeitura_ti
      POSTGRES_PASSWORD: prefeitura_ti_local
    ports:
      - "5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
